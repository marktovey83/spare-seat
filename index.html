<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spare Seat</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css?v=27" />
  <link rel="stylesheet" href="css/auth.css?v=27" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .logo-mark { width:36px;height:36px;border-radius:10px;display:block; }
    .logo-mark.big { width:88px;height:88px;border-radius:22px;margin:0 auto 12px;box-shadow:0 0 28px rgba(255,106,26,.55); }
    .ss-back,.ss-tab,.door,.auth-card .btn { font-family:"Bebas Neue",sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:16px; }
    .ss-back { display:block;width:100%;margin:0 0 10px;padding:12px 14px;background:#071018!important;color:#ff6a1a!important;border:1.5px solid #ff6a1a!important; }
    .ss-switch { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px; }
    .ss-tab { width:100%;padding:14px 12px;background:#071018!important;color:#fff8f0!important;border:1.5px solid #ff6a1a!important; }
    .ss-tab.on,.ss-tab.active { background:#ff6a1a!important;color:#071018!important; }
    .auth-card .btn { width:100%;padding:14px 16px;background:#ff6a1a;color:#071018;border:0; }
    .two-doors { display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px; }
  </style>
</head>
<body class="gate-on">
  <div class="app">
    <div class="topbar" id="topbar">
      <div class="brand"><img class="logo-mark" src="logo.svg" alt="Spare Seat" /> SPARE SEAT</div>
      <div class="tabs-user" id="who"></div>
      <button class="btn ghost" id="btn-out" onclick="logout()">Log out</button>
    </div>
    <div id="toast" class="pill hidden" style="margin-bottom:12px"></div>
    <section id="view-gate">
      <div class="gate-logo">
        <img class="logo-mark big" src="logo.svg" alt="Spare Seat" />
        <div class="gate-word">SPARE SEAT</div>
        <p class="muted">Don't watch it alone</p>
      </div>
      <div class="ad-slot" id="ad-slot">This strip can hold a sponsor later</div>
      <div class="auth-wrap">
        <div class="two-doors" id="two-doors">
          <button type="button" class="door" onclick="setAuthRole('user')">User</button>
          <button type="button" class="door venue" onclick="setAuthRole('venue')">Venue</button>
          <button type="button" class="door" onclick="setAuthRole('admin')">Admin</button>
        </div>
        <p class="muted" id="pick-hint" style="text-align:center">User, venue, or admin.</p>
        <div id="auth-steps" class="hidden">
          <button type="button" class="ss-back" onclick="resetAuth()">&larr; Back</button>
          <div class="ss-switch">
            <button type="button" class="ss-tab on" id="sw-login" onclick="setAuthMode('login')">Log in</button>
            <button type="button" class="ss-tab" id="sw-signup" onclick="setAuthMode('signup')">Register</button>
          </div>
          <div class="card auth-card">
            <div id="auth-user-login">
              <h2>User login</h2>
              <label>Name or email</label><input id="u-login-id" placeholder="Dave" />
              <label>Password</label><input id="u-login-pass" type="password" />
              <p class="muted">Demo: Dave / seat</p>
              <button class="btn" style="margin-top:12px" onclick="userLogin()">Log in</button>
            </div>
            <div id="auth-user-signup" class="hidden">
              <h2>User register</h2>
              <label>Name</label><input id="u-name" />
              <label>Email</label><input id="u-email" />
              <label>Password</label><input id="u-pass" type="password" />
              <label>Suburb</label><select id="p-sub"></select>
              <label>Sport</label><select id="p-sport"></select>
              <label>Club</label><select id="p-club"></select>
              <label>Age</label><select id="p-age"><option>30-44</option><option>18-29</option><option>45+</option></select>
              <div class="plan-pick">
                <label class="plan"><input type="radio" name="u-plan" value="free" checked /> <b>Free</b></label>
                <label class="plan plus"><input type="radio" name="u-plan" value="plus" /> <b>Plus $15/mo</b></label>
              </div>
              <button class="btn" style="margin-top:12px" onclick="userSignup()">Register</button>
            </div>
            <div id="auth-venue-login" class="hidden">
              <h2>Venue login</h2>
              <label>Pub / club</label><select id="v-pick"></select>
              <label>Password or PIN</label><input id="v-pin" type="password" />
              <p class="muted">Demo PIN 4821</p>
              <button class="btn" style="margin-top:12px" onclick="venueLogin()">Log in</button>
            </div>
            <div id="auth-venue-signup" class="hidden">
              <h2>Venue register</h2>
              <label>Venue name</label><input id="vs-name" />
              <label>Email</label><input id="vs-email" />
              <label>Suburb</label><select id="vs-sub"></select>
              <label>Password</label><input id="vs-pass" type="password" />
              <label>Staff PIN</label><input id="vs-pin" />
              <button class="btn" style="margin-top:12px" onclick="venueSignup()">Register venue</button>
            </div>
            <div id="auth-admin-login" class="hidden">
              <h2>Admin login</h2>
              <label>User</label><input id="a-user" placeholder="admin" />
              <label>Password</label><input id="a-pass" type="password" placeholder="spareseat" />
              <button class="btn" style="margin-top:12px" onclick="startAdmin()">Log in</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="view-app" class="hidden">
      <div class="nav" id="nav-punter">
        <button class="btn" data-tab="tonight" onclick="showPunter('tonight')">Today</button>
        <button class="btn" data-tab="venues" onclick="showPunter('venues')">Venues</button>
        <button class="btn" data-tab="chats" onclick="showPunter('chats')">Chats</button>
        <button class="btn" data-tab="friends" onclick="showPunter('friends')">Friends</button>
        <button class="btn" data-tab="me" onclick="showPunter('me')">Me</button>
      </div>
      <div class="nav hidden" id="nav-venue"></div>
      <div class="nav hidden" id="nav-admin">
        <button class="btn" data-tab="areas" onclick="showAdmin('areas')">Areas</button>
        <button class="btn" data-tab="people" onclick="showAdmin('people')">People</button>
        <button class="btn" data-tab="live" onclick="showAdmin('live')">Venues</button>
        <button class="btn" data-tab="reports" onclick="showAdmin('reports')">Flags</button>
      </div>
      <div id="main"></div>
    </section>
    <p class="footer-help">Lifeline 13 11 14 · MensLine 1300 78 99 78</p>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js?v=27"></script>
  <script src="js/map.js"></script>
  <script src="js/tabs-fix.js"></script>
  <script src="js/lounge.js"></script>
  <script src="js/admin-map.js"></script>
  <script src="js/today-venues.js"></script>
  <script src="js/admin-dash.js"></script>
  <script src="js/venue-dash.js"></script>
  <script src="js/venue-games.js"></script>
</body>
</html>
